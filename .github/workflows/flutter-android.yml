name: Flutter Android CI

on:
  push:
    branches: [flutter-rewrite]
  pull_request:
    branches: [flutter-rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Flutter host because the source repo keeps the native app
      # separately from the Flutter rewrite.
      - name: Generate Android host
        run: flutter create --platforms=android --project-name flare_music .

      - name: Configure Flare Music branding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/drawable
          cat > /tmp/flare_launcher.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#070812"/>
                <stop offset="1" stop-color="#15101F"/>
              </linearGradient>
              <linearGradient id="flame" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
                <stop offset="0" stop-color="#FFB52E"/>
                <stop offset="0.42" stop-color="#FF4B35"/>
                <stop offset="0.72" stop-color="#FF1688"/>
                <stop offset="1" stop-color="#7419F5"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#bg)"/>
            <path d="M256 60c-29 62-96 91-125 147-34 66-14 145 47 188 49 35 121 39 179 1 67-44 77-130 34-191-18-26-46-49-55-93-19 38-44 59-69 79 9-48 5-91-11-131z" fill="url(#flame)"/>
            <path d="M256 142c-24 49-68 75-79 119-10 43 20 82 58 88 39 6 69-23 69-61v-63l53-24v80c0 61-38 109-96 116-62 8-117-34-122-91-6-60 29-99 69-122z" fill="#1B07122A"/>
            <path d="M238 207h59v65c0 18-14 32-32 32-18 0-32-12-32-29 0-17 14-29 32-29 6 0 11 1 16 3v-28l-43-18z" fill="#FFFFFB"/>
            <path d="M226 198l52 23v15l-52-23z" fill="#FFFFFB"/>
          </svg>
          EOF
          convert -background none /tmp/flare_launcher.svg android/app/src/main/res/drawable/flare_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          import re
          s = re.sub(r'(<application\b[^>]*?)android:label="[^"]+"', r'\1android:label="Flare Music"', s, count=1)
          s = re.sub(r'android:icon="@[^"]+"', 'android:icon="@drawable/flare_launcher"', s, count=1)
          s = re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@drawable/flare_launcher"', s, count=1)
          p.write_text(s)
          PY

      # audio_service requires the launcher Activity to provide its shared
      # FlutterEngine. The generated FlutterActivity does not do that.


      - name: Configure generated Android Gradle settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle.kts')
          s = p.read_text()
          if 'jitpack.io' not in s:
              marker = 'dependencyResolutionManagement {'
              if marker in s:
                  s = s.replace(
                      'dependencyResolutionManagement {\n    repositories {',
                      'dependencyResolutionManagement {\n    repositories {\n        maven { url = uri("https://jitpack.io") }',
                      1,
                  )
              else:
                  s += '\n\ndependencyResolutionManagement {\n    repositories {\n        maven { url = uri("https://jitpack.io") }\n    }\n}\n'
          p.write_text(s)
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'https://jitpack.io' not in s:
              s = 'repositories {\n    maven { url = uri("https://jitpack.io") }\n}\n\n' + s
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'isMinifyEnabled = false' not in s:
              s = s.replace('android {', 'android {\n    buildTypes {\n        getByName("release") {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }\n    }', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              marker = 'dependencies {'
              if marker in s:
                  s = s.replace(marker, marker + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
              else:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY

      - name: Configure audio_service Activity
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/flare_music
          cat > android/app/src/main/kotlin/com/example/flare_music/MainActivity.kt <<'EOF'
          package com.example.flare_music

          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.concurrent.Executors

          class MainActivity : AudioServiceActivity() {
              private val executor = Executors.newSingleThreadExecutor()
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "flare_music/native_resolver"
                  ).setMethodCallHandler { call, result ->
                      if (call.method != "resolve") {
                          result.notImplemented()
                          return@setMethodCallHandler
                      }
                      val videoId = call.argument<String>("videoId")
                      if (videoId.isNullOrBlank()) {
                          result.error("INVALID_ID", "Missing YouTube video ID", null)
                          return@setMethodCallHandler
                      }
                      executor.execute {
                          try {
                              val url = NewPipeAudioResolver.resolve(videoId)
                              mainHandler.post { result.success(url) }
                          } catch (e: Exception) {
                              mainHandler.post {
                                  result.error(
                                      "RESOLVE_FAILED",
                                      e.message ?: "Native YouTube extraction failed",
                                      null
                                  )
                              }
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  executor.shutdownNow()
                  super.onDestroy()
              }
          }
          EOF

      - name: Configure Android media playback service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          '''
          if 'android.permission.WAKE_LOCK' not in s:
              s = s.replace('<application', permissions + '\n    <application', 1)
          service = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
          '''
          if 'com.ryanheise.audioservice.AudioService' not in s:
              s = s.replace('</application>', service + '\n    </application>', 1)
          p.write_text(s)
          PY

      - name: Configure native YouTube resolver
        run: |
          cat > android/app/build.gradle.kts.tmp <<'EOF'
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          dep = '    implementation("com.github.teamnewpipe:newpipeextractor:0.26.5")\n    implementation("com.squareup.okhttp3:okhttp:4.12.0")'
          if dep not in s:
              s = s.replace('dependencies {', 'dependencies {\n' + dep, 1)
          p.write_text(s)
          PY
          mkdir -p android/app/src/main/kotlin/com/example/flare_music
          cat > android/app/src/main/kotlin/com/example/flare_music/NewPipeAudioResolver.kt <<'EOF'
          package com.example.flare_music

          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.downloader.Downloader
          import org.schabi.newpipe.extractor.downloader.Request
          import org.schabi.newpipe.extractor.downloader.Response
          import org.schabi.newpipe.extractor.localization.Localization
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import java.io.IOException
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.TimeUnit

          object NewPipeAudioResolver {
              private val client = OkHttpClient.Builder()
                  .callTimeout(25, TimeUnit.SECONDS)
                  .followRedirects(true)
                  .followSslRedirects(true)
                  .build()

              @Volatile private var initialized = false
              private data class CachedStream(val url: String, val savedAt: Long)
              private val cache = ConcurrentHashMap<String, CachedStream>()
              private val cacheTtlMs = TimeUnit.MINUTES.toMillis(20)

              @Synchronized private fun initialize() {
                  if (initialized) return
                  NewPipe.init(object : Downloader() {
                      override fun execute(request: Request): Response {
                          val bodyBytes = request.dataToSend()
                          val body = bodyBytes?.toRequestBody("application/octet-stream".toMediaType())
                          val builder = okhttp3.Request.Builder()
                              .url(request.url())
                              .method(request.httpMethod(), body)
                              .header("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/125.0.0.0 Mobile Safari/537.36")
                          request.headers().forEach { (name, values) ->
                              builder.removeHeader(name)
                              values.forEach { value -> builder.addHeader(name, value) }
                          }
                          client.newCall(builder.build()).execute().use { response ->
                              val responseBody = response.body?.string().orEmpty()
                              if (!response.isSuccessful) {
                                  throw IOException("Extractor HTTP ${response.code}: ${response.message}")
                              }
                              return Response(
                                  response.code,
                                  response.message,
                                  response.headers.toMultimap(),
                                  responseBody,
                                  response.request.url.toString()
                              )
                          }
                      }
                  }, Localization("en", "US"))
                  initialized = true
              }

              fun resolve(videoId: String): String {
                  require(videoId.matches(Regex("[A-Za-z0-9_-]{11}"))) { "Invalid YouTube video ID" }
                  val now = System.currentTimeMillis()
                  cache[videoId]?.takeIf { now - it.savedAt < cacheTtlMs }?.let { return it.url }
                  initialize()
                  val info = StreamInfo.getInfo("https://www.youtube.com/watch?v=$videoId")
                  val audio = info.audioStreams
                      .filter { it.isUrl && it.content.startsWith("https://") }
                      .maxByOrNull { it.averageBitrate }
                      ?: throw IOException("NewPipe found no direct audio-only stream")
                  return audio.content.also { cache[videoId] = CachedStream(it, now) }
              }
          }
          EOF

      - name: Configure permanent release signing
        env:
          FLARE_KEYSTORE_BASE64: ${{ secrets.FLARE_KEYSTORE_BASE64 }}
          FLARE_KEYSTORE_PASSWORD: ${{ secrets.FLARE_KEYSTORE_PASSWORD }}
          FLARE_KEY_ALIAS: ${{ secrets.FLARE_KEY_ALIAS }}
          FLARE_KEY_PASSWORD: ${{ secrets.FLARE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FLARE_KEYSTORE_BASE64"
          test -n "$FLARE_KEYSTORE_PASSWORD"
          test -n "$FLARE_KEY_ALIAS"
          test -n "$FLARE_KEY_PASSWORD"
          echo "$FLARE_KEYSTORE_BASE64" | base64 --decode > android/app/flare-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          signing = '''    signingConfigs {
              create("release") {
                  storeFile = file("flare-release.jks")
                  storePassword = System.getenv("FLARE_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("FLARE_KEY_ALIAS")
                  keyPassword = System.getenv("FLARE_KEY_PASSWORD")
              }
          }
          '''
          if 'create("release")' not in s:
              s = s.replace('android {', 'android {\n' + signing, 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('isShrinkResources = false', 'isShrinkResources = false\n            signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-pub

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlareMusic-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
