name: Kotlin Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "kotlin-v*"

permissions:
  contents: write

concurrency:
  group: flaremusic-kotlin-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Kotlin Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kotlin app
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flaremusic-debug-signing-v1

      - name: Ensure signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set unique Android version
        run: echo "BUILD_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build Kotlin APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -m1 "^package:"

      - name: Prepare release APK
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/FlareMusic-Kotlin-$VERSION.apk"
          sha256sum "release/FlareMusic-Kotlin-$VERSION.apk" > "release/FlareMusic-Kotlin-$VERSION.apk.sha256"

      - name: Upload Kotlin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlareMusic-Kotlin-release
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" release/*             --target main             --title "FlareMusic Kotlin $TAG_NAME"             --generate-notes
