name: Flutter Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: flaremusic-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Flutter APK release
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 (optional prerelease suffix allowed)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for Flutter build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          HEAD_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail

          # A tag push starts both workflows. Wait for the matching Flutter CI
          # run so the release always contains the exact Flutter APK produced
          # from this tag.
          for attempt in {1..60}; do
            RUN_JSON="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow flutter-android.yml               --commit "$HEAD_SHA"               --limit 10               --json databaseId,status,conclusion,headSha)"

            RUN_ID="$(echo "$RUN_JSON" | jq -r 'map(select(.headSha == "'"$HEAD_SHA"'")) | .[0].databaseId // empty')"
            STATUS="$(echo "$RUN_JSON" | jq -r 'map(select(.headSha == "'"$HEAD_SHA"'")) | .[0].status // empty')"
            CONCLUSION="$(echo "$RUN_JSON" | jq -r 'map(select(.headSha == "'"$HEAD_SHA"'")) | .[0].conclusion // empty')"

            if [[ -n "$RUN_ID" ]]; then
              echo "Flutter build run $RUN_ID: $STATUS ($CONCLUSION)"
              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "Flutter build failed." >&2
                  exit 1
                fi
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Waiting for Flutter build to start..."
            fi

            sleep 10
          done

          echo "Timed out waiting for the Flutter build." >&2
          exit 1

      - name: Download Flutter APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name FlareMusic-Flutter-APK             --dir release

          APK="$(find release -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" "release/FlareMusic-${{ steps.version.outputs.tag }}.apk"
          sha256sum "release/FlareMusic-${{ steps.version.outputs.tag }}.apk"             > "release/FlareMusic-${{ steps.version.outputs.tag }}.apk.sha256"

      - name: Generate release with automatic changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/*               --repo "$GITHUB_REPOSITORY"               --clobber
            gh release edit "$TAG_NAME"               --repo "$GITHUB_REPOSITORY"               --title "FlareMusic $TAG_NAME"               --generate-notes               --target "${{ steps.version.outputs.sha }}"
          else
            gh release create "$TAG_NAME" release/*               --repo "$GITHUB_REPOSITORY"               --title "FlareMusic $TAG_NAME"               --generate-notes               --target "$GITHUB_SHA"
          fi
