name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flaremusic-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # For a tag push, build that exact tagged commit. Manual releases use the default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flaremusic-debug-signing-v1

      - name: Ensure debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set APK version code
        run: echo "BUILD_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and prepare APK
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 (optional prerelease suffix allowed)." >&2
            exit 1
          fi
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" "release/FlareMusic-$TAG_NAME.apk"
          sha256sum "release/FlareMusic-$TAG_NAME.apk" > "release/FlareMusic-$TAG_NAME.apk.sha256"

      - name: Publish GitHub release with generated changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "A release for $TAG_NAME already exists; updating its assets and generated notes."
            gh release upload "$TAG_NAME" release/* --clobber
            gh release edit "$TAG_NAME" --title "FlareMusic $TAG_NAME" --generate-notes
          else
            gh release create "$TAG_NAME" release/* \
              --target main \
              --title "FlareMusic $TAG_NAME" \
              --generate-notes
          fi
